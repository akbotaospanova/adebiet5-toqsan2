<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Қазақ әдебиеті · 5-сынып · 2-тоқсан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#071a4a; --deep:#0b2a6b; --blue:#1652c8; --sky:#3b82f6; --ice:#e8f0ff; --ice2:#f4f8ff;
  --gold:#f5b82e; --gold2:#ffd76a; --ink:#0f1e3d; --muted:#51607d; --line:#d6e2fb;
  --g1:#2563eb; --g2:#0891b2; --g3:#7c3aed; --g4:#db2777; --ok:#16a34a; --bad:#dc2626;
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Nunito","Segoe UI",Arial,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 85% -10%,#2f6bff55,transparent 60%),
             radial-gradient(900px 500px at -10% 30%,#00b3ff33,transparent 60%),
             linear-gradient(160deg,#061743 0%,#0b2a6b 45%,#123d97 100%);
  background-attachment:fixed;min-height:100vh;line-height:1.55}
h1,h2,h3,h4{font-family:"Montserrat","Segoe UI",Arial,sans-serif;margin:0}
a{color:inherit}
button{font-family:inherit;cursor:pointer}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(6,23,67,.82);backdrop-filter:blur(10px);border-bottom:1px solid #ffffff1a}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.logo-badge{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#ff9f1c);display:grid;place-items:center;font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-weight:800;color:var(--navy);font-size:15px;box-shadow:0 4px 14px #f5b82e55}
.logo b{display:block;font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-size:15px;letter-spacing:.2px}
.logo span{font-size:12px;color:#b9cdfa}
.top .sp{flex:1}
.menu-btn{display:none;background:#ffffff14;color:#fff;border:1px solid #ffffff2a;border-radius:10px;padding:8px 12px;font-weight:700}
.home-btn{background:#ffffff14;color:#fff;border:1px solid #ffffff2a;border-radius:10px;padding:8px 14px;font-weight:700;text-decoration:none;font-size:14px}
.home-btn:hover{background:#ffffff24}

/* ---------- layout ---------- */
.wrap{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:22px;padding:22px 18px 80px}
.side{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;background:rgba(255,255,255,.07);border:1px solid #ffffff1f;border-radius:var(--r);padding:12px}
.side h4{color:#cfe0ff;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:6px 8px 10px}
.side a{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:12px;color:#e6eeff;text-decoration:none;font-size:13.5px;line-height:1.3}
.side a:hover{background:#ffffff14}
.side a.on{background:#fff;color:var(--deep);font-weight:700}
.side a .num{flex:0 0 26px;height:26px;border-radius:8px;background:#ffffff1f;display:grid;place-items:center;font-weight:800;font-size:12px}
.side a.on .num{background:var(--gold);color:var(--navy)}
.side .tag{display:inline-block;font-size:10px;font-weight:800;background:var(--gold);color:var(--navy);border-radius:6px;padding:1px 6px;margin-left:4px}
main{min-width:0}

/* ---------- cards ---------- */
.card{background:#fff;border-radius:var(--r);padding:24px 26px;margin-bottom:18px;box-shadow:0 12px 34px #00113a40}
.sec-title{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-title .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--ice);flex:0 0 40px}
.sec-title h3{font-size:19px;color:var(--deep)}
.sec-title small{display:block;color:var(--muted);font-family:Nunito,"Segoe UI",Arial,sans-serif;font-weight:600;font-size:13px}

/* hero */
.hero{color:#fff;padding:34px 30px;border-radius:24px;background:linear-gradient(135deg,#1652c8 0%,#0b2a6b 60%,#071a4a 100%);border:1px solid #ffffff26;position:relative;overflow:hidden;margin-bottom:18px;box-shadow:0 16px 40px #00113a55}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,#ffd76a44,transparent 70%)}
.hero .kicker{display:inline-block;background:#ffffff1f;border:1px solid #ffffff33;border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700;color:#dbe7ff}
.hero h1{font-size:clamp(26px,3.4vw,40px);margin:14px 0 8px;line-height:1.15}
.hero h1 em{font-style:normal;color:var(--gold2)}
.hero p{color:#cfe0ff;max-width:760px;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;position:relative;z-index:1}
.stat{background:#ffffff14;border:1px solid #ffffff2a;border-radius:14px;padding:10px 16px;min-width:120px}
.stat b{display:block;font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-size:24px;color:var(--gold2)}
.stat span{font-size:12.5px;color:#cfe0ff}

.author{display:flex;gap:18px;align-items:center}
.author .av{flex:0 0 74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--deep));display:grid;place-items:center;color:#fff;font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-weight:800;font-size:24px;border:4px solid var(--ice)}
.author h3{font-size:20px;color:var(--deep)}
.author p{margin:4px 0 0;color:var(--muted)}

table.ktp{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.ktp th{background:var(--deep);color:#fff;text-align:left;padding:10px 12px;font-weight:700}
table.ktp th:first-child{border-top-left-radius:12px}table.ktp th:last-child{border-top-right-radius:12px}
table.ktp td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.ktp tr.row{cursor:pointer}
table.ktp tr.row:hover td{background:var(--ice2)}
.code{display:inline-block;font-weight:800;color:var(--blue);background:var(--ice);border-radius:6px;padding:0 6px;margin:1px 4px 1px 0;font-size:12.5px;white-space:nowrap}
.bjb-tag{display:inline-block;background:var(--gold);color:var(--navy);font-weight:800;font-size:11px;border-radius:6px;padding:1px 7px;margin-left:6px}

.books{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.book{border-radius:16px;padding:16px;background:var(--ice2);border:1px solid var(--line);position:relative}
.book .spine{position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 6px 6px 0}
.book h4{font-size:15px;color:var(--deep)}
.book small{color:var(--muted);font-size:12.5px}
.book .pg{display:inline-block;margin:8px 0 6px;font-weight:800;font-size:12.5px;color:#fff;border-radius:8px;padding:2px 9px}
.book p{margin:0;font-size:14px}

.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.legend div{background:var(--ice2);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:13.5px}
.legend b{display:block;font-size:22px;margin-bottom:4px}

/* lesson header */
.lhead{color:#fff;border-radius:24px;padding:26px 28px;background:linear-gradient(135deg,#1652c8,#0b2a6b);border:1px solid #ffffff26;margin-bottom:14px;box-shadow:0 16px 40px #00113a55}
.lhead .crumbs{font-size:13px;color:#b9cdfa;font-weight:700}
.lhead h2{font-size:clamp(21px,2.6vw,30px);margin:8px 0 12px;line-height:1.2}
.lhead .goals{display:flex;flex-direction:column;gap:6px}
.lhead .goal{background:#ffffff14;border:1px solid #ffffff26;border-radius:12px;padding:8px 12px;font-size:14px}
.lhead .goal b{color:var(--gold2);margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;position:sticky;top:70px;z-index:10;padding:8px 10px;background:rgba(6,23,67,.9);border:1px solid #ffffff1f;border-radius:16px;backdrop-filter:blur(8px)}
.chips a{background:#ffffff18;border:1px solid #ffffff2e;color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:7px 12px;border-radius:99px;backdrop-filter:blur(6px)}
.chips a:hover{background:#fff;color:var(--deep)}

.aim{background:linear-gradient(135deg,var(--ice),#fff);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.hook{background:#fff8e6;border:1px solid #fde4a6;border-left:5px solid var(--gold);border-radius:14px;padding:14px 16px}
.hook b,.aim b{display:block;font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-size:13px;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px}
.aim b{color:var(--blue)}.hook b{color:#b7791f}

.theory p{margin:0 0 12px}
.theory i{color:var(--blue);font-style:normal;font-weight:700}
.terms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.term{background:var(--ice2);border:1px dashed #9db8f0;border-radius:12px;padding:10px 12px;font-size:14px}
.term b{color:var(--deep);display:block}
table.mini{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 12px}
table.mini th{background:var(--ice);color:var(--deep);padding:8px;text-align:left}
table.mini td{border-top:1px solid var(--line);padding:8px;vertical-align:top}

/* group tasks */
.tasks{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.task{border-radius:18px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;background:#fff}
.task .th{padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.task .th h4{font-size:16px}
.task .th .gtag{font-size:12px;font-weight:800;background:#ffffff2e;border-radius:99px;padding:3px 10px;white-space:nowrap}
.task .tb{padding:14px 16px;flex:1;display:flex;flex-direction:column}
.task .method{display:inline-block;font-size:12px;font-weight:800;color:var(--muted);background:var(--ice2);border-radius:8px;padding:2px 8px;margin-bottom:8px}
.task p{margin:0 0 12px;font-size:14.5px}
.desc{margin-top:auto;background:var(--ice2);border-radius:12px;padding:10px 12px}
.desc b{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--deep)}
.desc ul{margin:6px 0 0;padding:0;list-style:none}
.desc li{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:3px 0;cursor:pointer;user-select:none}
.desc li .bx{flex:0 0 18px;height:18px;border-radius:5px;border:2px solid #9db8f0;margin-top:2px;display:grid;place-items:center;font-size:12px;color:#fff}
.desc li.done .bx{background:var(--ok);border-color:var(--ok)}
.desc li.done span{color:var(--ok);font-weight:700}
.desc .score{font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:700}

/* SEN */
.sen{border:2px dashed #93c5fd;border-radius:18px;padding:18px;background:linear-gradient(180deg,#f0f7ff,#fff)}
.sen .intro{font-size:14.5px;margin:0 0 10px}
.sen .support{font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.sen .support b{color:var(--g2)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:8px}
.pill{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14.5px;text-align:left;transition:.15s}
.pill:hover{border-color:var(--sky)}
.pill.sel{border-color:var(--blue);background:var(--ice)}
.pill.ok{border-color:var(--ok);background:#dcfce7;color:#14532d;cursor:default}
.pill.bad{border-color:var(--bad);background:#fee2e2;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mcq{display:flex;flex-direction:column;gap:14px}
.mcq .q{font-weight:800;margin-bottom:6px}
.mcq .opts{display:flex;flex-wrap:wrap;gap:8px}
.order-box{display:flex;flex-direction:column;gap:8px}
.order-res{display:flex;flex-direction:column;gap:6px;margin-top:12px;counter-reset:o}
.order-res div{background:#dcfce7;border:1px solid #86efac;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.order-res div:before{counter-increment:o;content:counter(o) ". ";color:var(--ok)}
.sort{display:flex;flex-direction:column;gap:12px}
.sort .pool{display:flex;flex-wrap:wrap;gap:8px}
.sort .bins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bin{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:90px;background:#fff}
.bin h5{margin:0 0 8px;font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-size:14px;color:var(--deep)}
.bin .pill{display:inline-block;margin:0 6px 6px 0;padding:6px 10px;font-size:13.5px}
.sort .hint{font-size:13px;color:var(--muted)}
.letter{background:#fffdf7;border:1px solid #f2e3b3;border-radius:12px;padding:16px 18px;font-size:15.5px;line-height:2.1;font-family:Georgia,"Times New Roman",serif}
.sen .mini-btn{margin-top:12px}
.mini-btn{background:var(--ice);color:var(--deep);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:800;font-size:13px}
.mini-btn:hover{background:#dbe7ff}
.done-msg{margin-top:12px;font-weight:800;color:var(--ok);display:none}
.done-msg.show{display:block}

/* IQ zone */
.iq-score{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.team{border-radius:16px;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.team .tn{font-weight:800;font-size:14px;line-height:1.2}
.team .tn small{display:block;opacity:.85;font-weight:600;font-size:12px}
.team .pts{display:flex;align-items:center;gap:6px}
.team .pts b{font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-size:26px;min-width:34px;text-align:center}
.team .pts button{width:30px;height:30px;border-radius:9px;border:none;background:#ffffff33;color:#fff;font-weight:800;font-size:16px}
.team .pts button:hover{background:#ffffff55}
.iq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.iq-col h5{margin:0 0 10px;font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-size:14.5px;color:var(--deep);display:flex;align-items:center;gap:8px}
.iq-col h5 i{width:12px;height:12px;border-radius:4px;display:inline-block}
.qcard{background:var(--ice2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;transition:.15s;position:relative}
.qcard:hover{border-color:var(--sky);transform:translateY(-1px)}
.qcard .qn{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.qcard .qq{font-weight:700;font-size:14.5px;margin-top:2px}
.qcard .qa{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed #9db8f0;color:var(--ok);font-weight:700;font-size:14px}
.qcard.open .qa{display:block}
.qcard .hint{font-size:12px;color:var(--muted);margin-top:6px}
.qcard.open .hint{display:none}

/* BJB */
.bjb table{width:100%;border-collapse:collapse;font-size:14px}
.bjb th{background:var(--navy);color:#fff;padding:9px;text-align:left}
.bjb td{border-bottom:1px solid var(--line);padding:9px;vertical-align:top}
.bjb td.b{text-align:center;font-weight:800;color:var(--blue);font-size:16px}
.bjb tfoot td{font-weight:800;background:var(--ice)}

/* reflection */
.refl{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:start}
.refl ol{margin:0;padding-left:20px}
.refl li{margin-bottom:8px;font-size:15px}
.refl .how{background:var(--ice2);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.vote{display:flex;flex-direction:column;gap:10px}
.vote button{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;font-size:15px;text-align:left}
.vote button:hover{border-color:var(--sky)}
.vote button .e{font-size:26px}
.vote button .c{margin-left:auto;background:var(--deep);color:#fff;border-radius:99px;min-width:34px;text-align:center;padding:2px 10px;font-family:Montserrat,"Segoe UI",Arial,sans-serif}
.vote .reset{align-self:flex-start;background:none;border:none;color:var(--muted);font-weight:700;font-size:13px;padding:2px;text-decoration:underline}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
.pager a{flex:1;background:#ffffff14;border:1px solid #ffffff2e;border-radius:16px;padding:14px 16px;color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.pager a:hover{background:#ffffff26}
.pager a small{display:block;color:#b9cdfa;font-weight:600}
.pager a.r{text-align:right}

footer{text-align:center;color:#b9cdfa;font-size:13px;padding:10px 0 30px}
footer b{color:#fff}

/* timer */
.timer{position:fixed;right:18px;bottom:18px;z-index:40;background:#fff;border-radius:18px;box-shadow:0 14px 40px #00113a66;padding:10px 12px;display:flex;align-items:center;gap:8px}
.timer .disp{font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-weight:800;font-size:22px;color:var(--deep);min-width:72px;text-align:center}
.timer button{border:none;background:var(--ice);color:var(--deep);font-weight:800;border-radius:9px;padding:6px 9px;font-size:12.5px}
.timer button.go{background:var(--blue);color:#fff}
.timer.ring{animation:ring .6s infinite alternate}
.timer.ring .disp{color:var(--bad)}
@keyframes ring{from{box-shadow:0 0 0 0 #f5b82e}to{box-shadow:0 0 0 10px #f5b82e00}}
.timer .tl{font-size:16px}

/* page links */
.pglink{display:inline-block;background:var(--ice);color:var(--blue);font-weight:800;border:1px solid #bcd0f7;border-radius:7px;padding:0 6px;cursor:pointer;text-decoration:none;white-space:nowrap}
.pglink:hover{background:var(--blue);color:#fff}
.pgbtns{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.pgbtns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;font-weight:800;font-size:12.5px;color:var(--deep)}
.pgbtns button:hover{background:var(--deep);color:#fff}
.top .bk-btn{background:var(--gold);color:var(--navy);border:none;border-radius:10px;padding:8px 14px;font-weight:800;font-size:14px;text-decoration:none}

/* viewer */
.viewer{position:fixed;inset:0;z-index:80;background:#020b24ee;display:none;flex-direction:column}
.viewer.show{display:flex}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#061743;color:#fff;flex-wrap:wrap}
.vbar select,.vbar input{font-family:inherit;font-weight:700;border-radius:9px;border:none;padding:7px 9px}
.vbar input{width:70px}
.vbar button{background:#ffffff1f;color:#fff;border:1px solid #ffffff33;border-radius:9px;padding:7px 12px;font-weight:800}
.vbar button:hover{background:#ffffff38}
.vbar .x{margin-left:auto;background:var(--bad);border:none}
.vbar .info{font-size:13px;color:#b9cdfa}
.vbody{flex:1;overflow:auto;display:flex;justify-content:center;padding:14px}
.vbody img{max-width:min(900px,100%);height:auto;background:#fff;border-radius:6px;box-shadow:0 10px 40px #0008;align-self:flex-start}
.vbody.zoom img{max-width:none;width:1300px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;background:#061743}
.thumbs button{flex:0 0 auto;border:2px solid transparent;border-radius:6px;padding:0;background:none}
.thumbs button.on{border-color:var(--gold)}
.thumbs img{height:70px;display:block;border-radius:4px}
.thumbs span{display:block;color:#cfe0ff;font-size:11px;font-weight:700}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.shelf .bk{background:var(--ice2);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.shelf .bk img{width:100%;max-width:220px;border-radius:8px;box-shadow:0 8px 20px #00113a40;cursor:pointer}
.shelf .bk h4{margin:10px 0 2px;color:var(--deep)}
.shelf .bk small{color:var(--muted)}

/* games */
.gtabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.gtabs button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:800;font-size:13.5px;color:var(--deep)}
.gtabs button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.gbox{background:linear-gradient(180deg,#f4f8ff,#fff);border:1px solid var(--line);border-radius:18px;padding:18px;min-height:220px}

 шешімі. Әр сатыға мәтіннен бір дәйексөз (сөйлем) таңдап, қысқаша мазмұнын жазыңдар.", "**3-тапсырма. ТЖ. 2-топ «Карта-саяхат»** («Оқиға картасы» әдісі). Әңгімеде аталатын жерлерді (Түркістан, Торғай, Қабырға өзені, Үргеніш, Қоқан, Бұхара, Қоңырат) картаға түсіріп, Сейітқұлдың көш жолын сызыңдар. Неліктен ол Қабырға бойын таңдады? Себептерін жазыңдар.", "**4-тапсырма. ТЖ. 3-топ «Екі ағайынды – екі жол»** («Салыстыру кестесі» әдісі). Сейітқұл мен оның ағасының таңдаған жолын салыстырыңдар: кәсібі, мақсаты, іс-әрекеті, тағдыры. «Ұрлық түбі – қорлық» мақалын дәлелдеңдер.", "**5-тапсырма. ТЖ. 4-топ «Тақырып пен идея»** («Түйін сөз» әдісі). Әңгіменің тақырыбы мен идеясын анықтаңдар. Идеяны ашатын 3 сөйлемді мәтіннен тауып, оны оқулықтағы мақалдармен («Еңбек ер атандырады», «Ынтымақ қайда болса, бақ сонда») байланыстырыңдар.", "**6-тапсырма. ЕББҚ. «Оқиғаны ретімен қой».** Оқиғаларды болған ретімен басып шық. Қате болса, «Қайта бастау» түймесін бас. Қолдау: Көмек: алдымен ой, сосын көш, сосын егін, сосын байлық.", "**7-тапсырма. Зияткерлік алаң (3 топ).** 1-топ «Географтар»: Қабырға өзені қай өңірде ағады? Қабырға өзенінің ұзындығы? Сейітқұлдың ағасы қай жақта қалды?; 2-топ «Егіншілер»: Шығыр деген не? Сейітқұл қандай дақылдар екті? Кетпен не үшін керек?; 3-топ «Есепшілер»: Басында Сейітқұлда неше үй болды? Кейін ел неше үйге таянды? Бұл неше жылда болды?"], "S": ["Оқулықтағы мәтінмен танысып, негізгі мазмұнды тірек сызбаға түсіреді, жаңа сөздердің мағынасын түсінеді.", "**1-топ** «Сюжет баспалдағы»: 4 сатыны дұрыс бөледі, әр сатыға дәйексөз келтіреді, оқиғаны ретімен баяндайды; спикер арқылы қорғайды.", "**2-топ** «Карта-саяхат»: оқиға орындарын атайды, көш жолын көрсетеді, таңдау себебін түсіндіреді; спикер арқылы қорғайды.", "**3-топ** «Екі ағайынды – екі жол»: 4 белгі бойынша салыстырады, тағдырларын көрсетеді, мақалды дәлелдейді; спикер арқылы қорғайды.", "**4-топ** «Тақырып пен идея»: тақырыпты анықтайды, идеяны тұжырымдайды, мақалмен байланыстырады; спикер арқылы қо қ, жүн, тері, мата) арқылы топқа бөлінеді.", "**Үй тапсырмасын тексеру:** Әңгімені жоспар бойынша мазмұндату, Торғай өңірі туралы деректерді тыңдау.", "**Ой шақыру.** Сауда етуге мал жоқ, жер бар, адам бар. Сен Сейітқұлдың орнында болсаң, неден бастар едің?", "**Құндылық:** Кәсіпкерлік, жауапкершілік.", "Сабақтың тақырыбы мен мақсатын таныстырамын."], "S": ["Сәлемдесіп, топқа бөлінеді, топ ережесін еске түсіреді.", "Үй тапсырмасын қорғайды.", "Ой шақыру сұрағына пікір айтып, тақырыпты болжайды.", "**ЕББҚ:** суреттен немесе тірек сөзден бір жауап айтады."], "A": ["Үй тапсырмасы – 2 балл", "Мадақтау: «Жарайсың!»"], "R": ["Оқулықтар: «Арман-ПВ», «Атамұра», «Мектеп»", "Слайд, суреттер, интерактив сайт"]}, "mid": {"time": "33 минут", "T": ["**1-тапсырма. Оқулықпен жұмыс (ҰЖ).** Сейітқұлдың іс-әрекетін «кәсіпкерлік әліппесі» ретінде (мақсат, орын, еңбек, технология, сату, қауіпсіздік, сауда) талдап, образын ашатын сөз тіркестерін мәтіннен табуға бағыттаймын.", "**2-тапсырма. ТЖ. 1-топ «Бизнес-жоспар»** («Кәсіпкерлік әліппесі» әдісі). Сейітқұлдың іс-әрекетін бизнес-жоспар кестесіне түсіріңдер: мақсат – ресурс (жер, су, адам) – әдіс – өнім – сату – қауіпсіздік – нәтиже. Әр қадамды мәтінмен дәлелдеңдер.", "**3-тапсырма. ТЖ. 2-топ «Образ кластері»** («Кластер» әдісі). Сейітқұлға тән қасиеттерді кластерге түсіріңдер. Әр қасиетті оның нақты ісімен дәлелдеңдер (мысалы: көреген – мекенді жау шабуылынан шетірек таңдады).", "**4-тапсырма. ТЖ. 3-топ «Жәрмеңке жарнамасы»** («Жарнама парағы» әдісі). Сейітқұл қорғанында өтетін жәрмеңкеге шақыру-жарнама жасаңдар: не сатылады (астық, тауар), не айырбасталады (мал, жүн, тері), қашан өтеді. Жарнаманы көрнекі етіп, топ атынан таныстырыңдар.", "**5-тапсырма. ТЖ. 4-топ «Сейітқұлға хат немесе өлең»** («Шығармашылық шеберхана» әдісі). Сейітқұлға хат немесе 8 жолдық өлең жазыңдар: оның қандай ісі сендерге ұнады, бүгінгі жастар одан не үйренеді? Өлеңде эпитет, қайталау болсын.", "**6-тапсырма. ЕББҚ. «Сөз бен мағынасы».** Сөзді басып, мағынасын тап. Қолдау: Көмек: оқулықтағы «Сөзмаржан» бөлімін қара.", "**7-тапсырма. Зияткерлік алаң (3 топ).** 1-топ «Іскерлер»: Сейітқұл артық астықты не істеді? Қай қалаларға мал айдатты? Жәрмеңке қашан өтетін?; 2-топ «Образшылар»: Сейітқұлдың көрегендігі неден көрінеді? Бауырмалдығы неден көрінеді? Неге оны «жұрт ағасы» деді?; 3-топ «Болашақшылар»: Сейітқұл бүгін өмір сүрсе, қандай кәсіп ашар еді? Сейітқұлдың кәсіпкерлігінің басты сыры неде? Бір сөзбен Сейітқұл кім?"], "S": ["Оқулықтағы мәтінмен танысып, негізгі мазмұнды тірек сызбаға түсіреді, жаңа сөздердің мағынасын түсінеді.", "**1-топ** «Бизнес-жоспар»: жоспардың 7 қадамын толтырады, мәтінмен дәлелдейді, нәтижені көрсетеді; спикер арқылы қорғайды.", "**2-топ** «Образ кластері»: кемінде 6 қасиет жазады, әр қасиетті ісімен дәлелдейді, образға қорытынды жасайды; спикер арқылы қорғайды.", "**3-топ** «Жәрмеңке жарнамасы»: әңгімедегі деректерді пайдаланады, жарнама тілімен жазады, мәнерлеп таныстырады; спикер арқылы қорғайды.", "**4-топ** «Сейітқұлға хат немесе өлең»: әсерін сипаттайды, кейіпкердің ісін атайды, көркемдік құрал қолданады; спикер арқылы қорғайды.", "**ЕББҚ:** Сөзді мағынасымен сәйкестендіреді (кетпен, шығыр, жәрмеңке, барымта).", "Зияткерлік алаң сұрақтарына топпен жауап беріп, ұпай жинайды; қате жауапты басқа топ толықтырады."], "A": ["**1-топ:** жоспардың 7 қадамын толтырады – 1; мәтінмен дәлелдейді – 1; нәтижені көрсетеді – 1", "**2-топ:** кемінде 6 қасиет жазады – 1; әр қасиетті ісімен дәлелдейді – 1; образға қорытынды жасайды – 1", "**3-топ:** әңгімедегі деректерді пайдаланады – 1; жарнама тілімен жазады – 1; мәнерлеп таныстырады – 1", "**4-топ:** әсерін сипаттайды – 1; кейіпкердің ісін атайды – 1; көркемдік құрал қолданады – 1", "Зияткерлік алаң: әр дұрыс жауап – 1 ұпай", "Қалыптастырушы бағалау: «Екі жұлдыз, бір тілек», «Жарайсың!», «Талпын!»"], "R": ["«Арман-ПВ», 73–75-бет; «Атамұра», 73–74-бет; «Мектеп», 42–43-бет", "Флипчарт, маркер, стикер", "ЕББҚ карточкасы", "Таймер, ұпай тақтасы"]}, "end": {"time": "5 минут", "T": ["**Рефлексия «Кәсіпкер баспалдағы».** Оқушылар баспалдақтың өздері тұрған сатысына стикер жапсырады.", "1-саты: Сейітқұлдың істерін білемін. 2-саты: Оның қасиеттерін дәлелдей аламын. 3-саты: Өз кәсібімнің жоспарын құра аламын."], "S": ["Рефлексия сұрақтарына жауап беріп, өзін-өзі бағалайды."], "A": ["Өзін-өзі бағалау"], "R": ["Стикерлер, смайликтер"]}}, "hw": {"A": "Сейітқұлға хат немесе өлең жазу", "B": "«Мен кәсіпкер болсам» – 5 қадамдық бизнес-жоспар құру", "E": "5 кәсіп атауын жазып, біреуінің суретін салу"}}, {"n": 11, "title": "Ы.Алтынсарин «Қыпшақ Сейітқұл». Сейітқұл – заманынан озып туған адам", "section": "«Тәрбиенің қайнар бұлағы»", "goals": ["5.3.3.1 шығармадағы кейіпкерді өзіндік құндылығы тұрғысынан талдап, әдеби эссе жазу", "5.3.4.1 оқырманның рухани дүниесіне шығарма әсерін талдай отырып, сыни хабарлама жазу"], "aims": "Сейітқұлдың заманынан озық тұлға екенін дәлелдейді; кейіпкер туралы әдеби эссе жазады; шығарманың оқырманға әсері туралы сыни хабарлама құрастырады.", "rows": {"start": {"time": "7 минут", "T": ["Оқушылармен сәлемдесемін, «Шаттық шеңбері» арқылы жағымды ахуал туғызамын.", "**Топқа бөлу:** «Балық қаңқасы» бөліктері (бас, сүйек, құйрық) арқылы топқа бөлінеді.", "**Үй тапсырмасын тексеру:** Сейітқұлға жазылған хаттар мен бизнес-жоспарларды тыңдау.", "**Ой шақыру.** Барлығы барымтамен күн көрген заманда біреу кетпен ұстап жер қазса, оны қалай атар едіңдер?", "**Құндылық:** Жаңашылдық, бірлік.", "Сабақтың тақырыбы мен мақсатын таныстырамын."], "S": ["Сәлемдесіп, топқа бөлінеді, топ ережесін еске түсіреді.", "Үй тапсырмасын қорғайды.", "Ой шақыру сұрағына пікір айтып, тақырыпты болжайды.", "**ЕББҚ:** суреттен немесе тірек сөзден бір жауап айтады."], "A": ["Үй тапсырмасы – 2 балл", "Мадақтау: «Жарайсың!»"], "R": ["Оқулықтар: «Арман-ПВ», «Атамұра», «Мектеп»", "Слайд, суреттер, интерактив сайт"]}, "mid": {"time": "33 минут", "T": ["**1-тапсырма. Оқулықпен жұмыс (ҰЖ).** Сейітқұл өмір сүрген заманның ерекшелігін (көшпелі тұрмыс, барымта) және оның жаңалықтарын (отырықшылық, суармалы егін, жәрмеңке, қорған) салыстырып, сыни хабарлама құрылымын түсіндіремін.", "**2-тапсырма. ТЖ. 1-топ «Заман және Сейітқұл»** («Салыстыру кестесі» әдісі). Кесте: «Сол заманның әдеті» (барымта, көшпелі өмір, жауласу) / «Сейітқұлдың жаңалығы» (егін, арық, шығыр, жәрмеңке, қорған). Әр жаңалықтың елге берген пайдасын жазыңдар.", "**3-тапсырма. ТЖ. 2-топ «Балық қаңқасы»** («Балық қаңқасы» әдісі). Арман-ПВ тапсырмасы бойынша: басы – мәселе («Елді қалай байытуға болады?»), жоғарғы сүйектер – себептер, төменгі сүйектер – дәлелдер (мәтіннен), құйрығы – қорытынды.", "**4-тапсырма. ТЖ. 3-топ «Әдеби эссе»** («ПОПС» әдісі). «Сейітқұл – заманынан озып туған адам» тақырыбына 8–10 сөйлемдік эссе жазыңдар. Кейіпкердің құндылықтарын (еңбек, бірлік, адалдық, қамқорлық) мәтінмен дәлелдеңдер.", "**5-тапсырма. ТЖ. 4-топ «Сыни хабарлама»** («Кітап шолуы» әдісі). «Қыпшақ Сейітқұл» әңгімесі туралы сыни хабарлама жазыңдар: автор, жанр, қысқаша мазмұны, әңгіменің сендерге әсері, баға (5 жұлдыз) және кімге оқуға ұсынасыңдар.", "**6-тапсырма. ЕББҚ. «Сейітқұлдың жаңалығы».** Дұрыс жауапты таңда. Қолдау: Көмек: Сейітқұлдың не істегенін еске түсір: кетпен, арық, шығыр.", "**7-тапсырма. Зияткерлік алаң (3 топ).** 1-топ «1-топ: «Алты неліктен»»: Неліктен Сейітқұл барымтаны таңдамады? Неліктен Қабырға бойын таңдады?; 2-топ «2-топ: «Алты неліктен»»: Неліктен басқа кедейлер Сейітқұлға қосылды? Неліктен қорған салды?; 3-топ «3-топ: «Алты неліктен»»: Неліктен ағасының тағдыры аянышты болды? Неліктен Ыбырай бұл әңгімені оқулығына енгізді?"], "S": ["Оқулықтағы мәтінмен танысып, негізгі мазмұнды тірек сызбаға түсіреді, жаңа сөздердің мағынасын түсінеді.", "**1-топ** «Заман және Сейітқұл»: заман ерекшелігін көрсетеді, Сейітқұлдың 4 жаңалығын атайды, пайдасын түсіндіреді; спикер арқылы қорғайды.", "**2-топ** «Балық қаңқасы»: мәселені анықтайды, 3 себеп пен 3 дәлел табады, қорытынды жасайды; спикер арқылы қорғайды.", "**3-топ** «Әдеби эссе»: тезисті айқын береді, 2–3 дәлел келтіреді, қорытындыда бүгінгі маңызын көрсетеді; спикер арқылы қорғайды.", "**4-топ** «Сыни хабарлама»: хабарлама құрылымын сақтайды, әсерін дәлелдейді, баға мен ұсыныс береді; спикер арқылы қорғайды.", "**ЕББҚ:** Сейітқұлдың жаңалығы туралы 3 сұраққа жауап таңдайды.", "Зияткерлік алаң сұрақтарына топпен жауап беріп, ұпай жинайды; қате жауапты басқа топ толықтырады."], "A": ["**1-топ:** заман ерекшелігін көрсетеді – 1; Сейітқұлдың 4 жаңалығын атайды – 1; пайдасын түсіндіреді – 1", "**2-топ:** мәселені анықтайды – 1; 3 себеп пен 3 дәлел табады – 1; қорытынды жасайды – 1", "**3-топ:** тезисті айқын береді – 1; 2–3 дәлел келтіреді – 1; қорытындыда бүгінгі маңызын көрсетеді – 1", "**4-топ:** хабарлама құрылымын сақтайды – 1; әсерін дәлелдейді – 1; баға мен ұсыныс береді – 1", "Зияткерлік алаң: әр дұрыс жауап – 1 ұпай", "Қалыптастырушы бағалау: «Екі жұлдыз, бір тілек», «Жарайсың!», «Талпын!»"], "R": ["«Арман-ПВ», 74–75-бет; «Атамұра», 72–74-бет; «Мектеп», 43-бет", "Флипчарт, маркер, стикер", "ЕББҚ карточкасы", "Таймер, ұпай тақтасы"]}, "end": {"time": "5 минут", "T": ["**Рефлексия «Ой шыңы».** Тақтада үш шыңы бар тау. Оқушы өз шыңын таңдап, стикер жапсырады.", "Бірінші шың – Білдім: Сейітқұлдың жаңалықтарын білемін. Екінші шың – Түсіндім: оның неге озық екенін дәлелдей аламын. Үшінші шың – Қолданамын: эссе мен сыни хабарлама жаза аламын."], "S": ["Рефлексия сұрақтарына жауап беріп, өзін-өзі бағалайды."], "A": ["Өзін-өзі бағалау"], "R": ["Стикерлер, смайликтер"]}}, "hw": {"A": "«Сейітқұл – заманынан озып туған адам» эссесін аяқтау", "B": "«Қыпшақ Сейітқұл» әңгімесіне сыни хабарлама жазу", "E": "Сейітқұлдың 3 ісін жазып, суретін салу"}}, {"n": 12, "title": "Ы.Алтынсарин «Дүние қалай етсең табылады». Өмірді өзгерткен кеңес", "section": "«Тәрбиенің қайнар бұлағы»", "goals": ["5.1.1.1 әдеби шығарманың жанрына қарай фабуласы мен сюжеттік дамуын сипаттау", "5.1.3.1 көркем шығармадағы кейіпкерлер портреті мен іс-әрекеті арқылы образын ашу"], "aims": "Әңгіменің оқиғасын уақыт ретімен сипаттайды; әңгіме ішіндегі әңгімені (бейтаныс кісінің тарихын) ажыратады; Антон мен бейтаныс кісінің образын ашады.", "rows": {"start": {"time": "7 минут", "T": ["Оқушылармен сәлемдесемін, «Шаттық шеңбері» арқылы жағымды ахуал туғызамын.", "**Топқа бөлу:** 1791 және 1815 жылдары жазылған карточкалар бойынша топқа бөлінеді.", "**Үй тапсырмасын тексеру:** Эсселер мен сыни хабарламаларды қорғау.", "**Ой шақыру.** «Еңбекке бейім болсаң, қатарыңнан кейін болмайсың». Бір ауыз кеңес адамның өмірін өзгерте ала ма?", "**Құндылық:** Еңбекқорлық, мақсаттылық.", "Сабақтың тақырыбы мен мақсатын таныстырамын."], "S": ["Сәлемдесіп, топқа бөлінеді, топ ережесін еске түсіреді.", "Үй тапсырмасын қорғайды.", "Ой шақыру сұрағына пікір айтып, тақырыпты болжайды.", "**ЕББҚ:** суреттен немесе тірек сөзден бір жауап айтады."], "A": ["Үй тапсырмасы – 2 балл", "Мадақтау: «Жарайсың!»"], "R": ["Оқулықтар: «Арман-ПВ», «Атамұра», «Мектеп»", "Слайд, суреттер, интерактив сайт"]}, "mid": {"time": "33 минут", "T": ["**1-тапсырма. Оқулықпен жұмыс (ҰЖ).** «Дүние қалай етсең табылады» әңгімесін оқып (Арман-ПВ, 65–66-бет), фабуланы уақыт ретімен (1791 → 1815) түсіндіріп, «әңгіме ішіндегі әңгімені» (бейтаныс кісінің тарихын) ажыратамын.", "**2-тапсырма. ТЖ. 1-топ «Уақыт сызығы»** («Уақыт таспасы» әдісі). 1791 жылдан 1815 жылға дейінгі оқиғаларды уақыт таспасына түсіріңдер. Бейтаныс кісінің өз тарихын (7 жыл) бөлек түспен белгілеңдер. Сюжеттің басталуы, шарықтауы, шешімін көрсетіңдер.", "**3-тапсырма. ТЖ. 2-топ «Үш кейіпкер»** («Кейіпкер паспорты» әдісі). Әңгімеші, Антон, бейтаныс кісі – әрқайсысына «паспорт» толтырыңдар: кім, қайда, не істейді, мінезі, мәтіннен сипаттайтын сөз. Кімнің сөзі оқиғаны өзгертті?", "**4-тапсырма. ТЖ. 3-топ «Антон: бұрын және кейін»** («Екі портрет» әдісі). Антонның екі портретін жасаңдар: 1791 жыл (тіленші) және 1815 жыл (дүкен иесі). Сыртқы келбеті, ісі, мінезі қалай өзгерді? Өзгеріс себебін түсіндіріңдер.", "**5-тапсырма. ТЖ. 4-топ «Кеңес картасы»** («Қадамдар» әдісі). Бейтаныс кісінің кеңесін қадамдарға бөліңдер (ерінбеу, аздан бастау, жинақтылық, машақаттан қашпау...). Осы кеңесті бүгінгі оқушы өміріне қалай қолдануға болады? Мысал келтіріңдер.", "**6-тапсырма. ЕББҚ. «Антонның жолы».** Оқиғаларды болған ретімен басып шық. Қолдау: Көмек: басында Антон тіленші, соңында дүкен иесі.", "**7-тапсырма. Зияткерлік алаң (3 топ).** 1-топ «Даталар»: Әңгіме қай жылы басталады? Әңгімеші Антонды қай жылы қайта кездестірді? Бейтаныс кісі неше жылда он мың франк тапты?; 2-топ «Қалалар»: Версаль қай елдегі қала? Брюссель – қай мемлекеттің астанасы? Антон Брюссельде қандай дүкеннің иесі болды?; 3-топ «Сөздікшілер»: «Приказчик» кім? «Франк» деген не? «Әйдік» сөзінің мағынасы?"], "S": ["Оқулықтағы мәтінмен танысып, негізгі мазмұнды тірек сызбаға түсіреді, жаңа сөздердің мағынасын түсінеді.", "**1-топ** «Уақыт сызығы»: оқиғаларды уақыт ретімен орналастырады, әңгіме ішіндегі әңгімені ажыратады, сюжет кезеңдерін белгілейді; спикер арқылы қорғайды.", "**2-топ** «Үш кейіпкер»: үш кейіпкерді сипаттайды, мәтіннен сөз тіркестерін келтіреді, оқиғадағы рөлін анықтайды; спикер арқылы қорғайды.", "**3-топ** «Антон: бұрын және кейін»: екі кезеңдегі бейнесін салыстырады, өзгеріс себебін көрсетеді, мәтінмен дәлелдейді; спикер арқылы қорғайды.", "**4-топ** «Кеңес картасы»: кеңесті 4–5 қадамға бөледі, мәтінмен дәлелдейді, өмірмен байланыстырады; спикер арқылы қорғайды.", "**ЕББҚ:** Антонның өміріндегі оқиғаларды ретімен орналастырады.", "Зияткерлік алаң сұрақтарына топпен жауап беріп, ұпай жинайды; қате жауапты басқа топ толықтырады."], "A": ["**1-топ:** оқиғаларды уақыт ретімен орналастырады – 1; әңгіме ішіндегі әңгімені ажыратады – 1; сюжет кезеңдерін белгілейді – 1", "**2-топ:** үш кейіпкерді сипаттайды – 1; мәтіннен сөз тіркестерін келтіреді – 1; оқиғадағы рөлін анықтайды – 1", "**3-топ:** екі кезеңдегі бейнесін салыстырады – 1; өзгеріс себебін көрсетеді – 1; мәтінмен дәлелдейді – 1", "**4-топ:** кеңесті 4–5 қадамға бөледі – 1; мәтінмен дә }

/* ---------- SEN widgets ---------- */
function doneMsg() { return `<div class="done-msg" id="senDone">🎉 Жарайсың! Тапсырма орындалды.</div>`; }
function renderSen(s) {
  const box = $("#senBox");
  if (s.type === "match") {
    const L = shuffle(s.pairs.map((p, i) => [p[0], i])), R = shuffle(s.pairs.map((p, i) => [p[1], i]));
    box.innerHTML = `<div class="match"><div class="col">${L.map(x => `<button class="pill l" data-i="${x[1]}">${esc(x[0])}</button>`).join("")}</div><div class="col">${R.map(x => `<button class="pill r" data-i="${x[1]}">${esc(x[0])}</button>`).join("")}</div></div>${doneMsg()}<button class="mini-btn" id="senRe">↺ Қайта бастау</button>`;
    let sel = null, ok = 0;
    box.querySelectorAll(".pill.l").forEach(b => b.onclick = () => { if (b.classList.contains("ok")) return; box.querySelectorAll(".pill.l").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = b; });
    box.querySelectorAll(".pill.r").forEach(b => b.onclick = () => {
      if (!sel || b.classList.contains("ok")) return;
      if (sel.dataset.i === b.dataset.i) { sel.classList.remove("sel"); sel.classList.add("ok"); b.classList.add("ok"); sel = null; if (++ok === s.pairs.length) $("#senDone").classList.add("show"); }
      else { b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 500); }
    });
  } else if (s.type === "mcq") {
    box.innerHTML = `<div class="mcq">${s.qs.map((q, i) => `<div><div class="q">${i + 1}. ${esc(q[0])}</div><div class="opts">${q[1].map((o, j) => `<button class="pill" data-q="${i}" data-j="${j}">${esc(o)}</button>`).join("")}</div></div>`).join("")}</div>${doneMsg()}<button class="mini-btn" id="senRe">↺ Қайта бастау</button>`;
    const got = new Set();
    box.querySelectorAll(".pill").forEach(b => b.onclick = () => {
      const q = +b.dataset.q, j = +b.dataset.j;
      if (got.has(q)) return;
      if (s.qs[q][2] === j) { b.classList.add("ok"); got.add(q); if (got.size === s.qs.length) $("#senDone").classList.add("show"); }
      else { b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 600); }
    });
  } else if (s.type === "order") {
    const items = shuffle(s.items.map((t, i) => [t, i]));
    box.innerHTML = `<div class="order-box">${items.map(x => `<button class="pill" data-i="${x[1]}">${esc(x[0])}</button>`).join("")}</div><div class="order-res" id="ores"></div>${doneMsg()}<button class="mini-btn" id="senRe">↺ Қайта бастау</button>`;
    let step = 0;
    box.querySelectorAll(".order-box .pill").forEach(b => b.onclick = () => {
      if (+b.dataset.i === step) { b.style.display = "none"; const d = document.createElement("div"); d.textContent = b.textContent; $("#ores").appendChild(d); if (++step === s.items.length) $("#senDone").classList.add("show"); }
      else { b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 500); }
    });
  } else if (s.type === "sort") {
    const items = shuffle(s.items.map((t, i) => [t[0], t[1], i]));
    box.innerHTML = `<div class="sort"><div class="hint">Сөзді таңда, сосын себетті бас.</div><div class="pool">${items.map(x => `<button class="pill" data-b="${x[1]}">${esc(x[0])}</button>`).join("")}</div><div class="bins">${s.bins.map((b, k) => `<div class="bin" data-k="${k}"><h5>${k === 0 ? "💙" : "🖤"} ${esc(b)}</h5></div>`).join("")}</div></div>${doneMsg()}<button class="mini-btn" id="senRe">↺ Қайта бастау</button>`;
    let sel = null, ok = 0;
    box.querySelectorAll(".pool .pill").forEach(b => b.onclick = () => { box.querySelectorAll(".pool .pill").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = b; });
    box.querySelectorAll(".bin").forEach(bin => bin.onclick = () => {
      if (!sel) return;
      if (sel.dataset.b === bin.dataset.k) { sel.classList.remove("sel"); sel.classList.add("ok"); bin.appendChild(sel); sel.onclick = null; sel = null; if (++ok === s.items.length) $("#senDone").classList.add("show"); }
      else { const t = sel; t.classList.add("bad"); setTimeout(() => t.classList.remove("bad"), 500); }
    });
  } else if (s.type === "text") {
    const words = s.support.replace(/^.*?:\s*/, "").split(/,\s*/);
    box.innerHTML = `<div class="letter">${s.body}</div><div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">${words.map(w => `<button class="pill">${esc(w)}</button>`).join("")}</div><div class="hint" style="font-size:13px;color:var(--muted);margin-top:8px">Сөзді басқанда ол белгіленеді – дәптерге көшіріп жазуға көмек.</div>`;
    box.querySelectorAll(".pill").forEach(b => b.onclick = () => b.classList.toggle("ok"));
  }

function linkify(root) {
  const re = /(Арман-ПВ|Атамұра|Мектеп)([^0-9<]{0,60}?)(\d{2,3})(?:[–-](\d{2,3}))?(-бет|-беттер)/g;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest("button,.pglink,script,a") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const t = n.nodeValue; if (!/-бет/.test(t)) return;
    re.lastIndex = 0; if (!re.test(t)) return; re.lastIndex = 0;
    const span = document.createElement("span");
    span.innerHTML = esc(t).replace(re, (m, pub, mid, a, b, suf) => `${pub}${mid}<a class="pglink" onclick="openBook('${BKEY[pub]}',${a})">📄 ${a}${b ? "–" + b : ""}${suf}</a>`);
    n.replaceWith(span);
  });
}

const GLOSS = (() => {
  const m = new Map(); const add = (w, d, src) => { const k = w.toLowerCase().replace(/[«»"]/g, "").trim(); if (!m.has(k)) m.set(k, [w, d, src]); };
  GLOSSARY_EXTRA.forEach(g => add(g[0], g[1], "Оқулық сөздігі"));
  LESSONS.forEach(l => { l.terms.forEach(t => add(t[0], t[1], l.n + "-сабақ")); EXTRA[l.n].scr.forEach(s => add(s[0][0] + s[0].slice(1).toLowerCase(), s[1], l.n + "-сабақ ойыны")); });
  return m;
})();
function botSay(html, who) { const d = document.createElement("div"); d.className = "msg " + (who || "b"); d.innerHTML = html; $("#botM").appendChild(d); $("#botM").scrollTop = 1e9; return d; }
function botAsk(q) {

  const k = q.toLowerCase().replace(/[«»"?.!]/g, "").trim();
  let hit = GLOSS.get(k);
  if (!hit) { for (const [kk, v] of GLOSS) { if (kk.startsWith(k) || k.startsWith(kk) && kk.length > 3) { hit = v; break; } } }
  if (hit) { botSay(`<b>${esc(hit[0])}</b> – ${esc(hit[1])}<br><small style="color:var(--muted)">Дереккөз: ${esc(hit[2])}</small>`); return; }
  const near = [...GLOSS.values()].filter(v => v[0].toLowerCase().includes(k.slice(0, 3))).slice(0, 4);
  const d = botSay(`«${esc(q)}» сөзі сайт сөздігінде жоқ екен. Оны <b>Сөздікқор</b> ұлттық порталынан іздейік: төмендегі сілтемені басқанда сөз көшіріледі, порталдың іздеу жолағына қойыңыз (Ctrl+V).<br><a href="https://sozdikqor.kz/" target="_blank" rel="noopener" id="sqLink">🔎 sozdikqor.kz сайтын ашу</a>${near.length ? `<div class="sug">${near.map(v => `<button>${esc(v[0])}</button>`).join("")}</div>` : ""}`);
  d.querySelectorAll(".sug button").forEach(b => b.onclick = () => botAsk(b.textContent));
  const a = d.querySelector("#sqLink"); a.removeAttribute("id"); a.addEventListener("click", () => { try { navigator.clipboard.writeText(q).catch(() => {}); } catch (e) {} });
}
(function () {
  $("#botFab").onclick = () => { $("#bot").classList.toggle("show"); if (!$("#botM").children.length) { const words = ["Білтелі", "Дәулет", "Шығыр", "Жәрмеңке", "Нәсіп", "Купец"]; const d = botSay(`Сәлем! Мен – <b>Сөздікқор-бот</b> 📖<br>Тоқсандағы шығармаларда кездесетін сөздің мағынасын айтамын. Табылмаса, <b>sozdikqor.kz</b> ұлттық сөздік порталына бағыттаймын.<div class="sug">${words.map(w => `<button>${w}</button>`).join("")}</div>`); d.querySelectorAll(".sug button").forEach(b => b.onclick = () => botAsk(b.textContent)); } $("#botI").focus(); };
  $("#botX").onclick = () => $("#bot").classList.remove("show");
  $("#botF").onsubmit = e => { e.preventDefault(); botAsk($("#botI").value); $("#botI").value = ""; };
})();

/* ---------- router ---------- */
function route() {
  const m = location.hash.match(/^#lesson-(\d+)$/);
  const l = m && LESSONS.find(x => x.n === +m[1]);
  if (location.hash === "#books") { renderSide(-1); renderShelf(); document.title = "Оқулықтар · Қазақ әдебиеті 5-сынып"; }
  else if (l) { renderSide(l.n); renderLesson(l); document.title = l.n + "-сабақ · Қазақ әдебиеті 5-сынып"; }
  else { renderSide(0); renderHome(); document.title = "Қазақ әдебиеті · 5-сынып · 2-тоқсан"; }
  $("#side").classList.remove("show");
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
$("#menuBtn").onclick = () => $("#side").classList.toggle("show");
route();

/* ---------- timer ---------- */
(function () {
  let total = 180, left = 180, t = null;
  const d = $("#tdisp"), go = $("#tgo"), box = $("#timer");
  const show = () => { d.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0"); };
  const stop = () => { clearInterval(t); t = null; go.textContent = "▶"; };
  document.querySelectorAll("#timer [data-m]").forEach(b => b.onclick = () => { stop(); box.classList.remove("ring"); total = left = +b.dataset.m * 60; show(); });
  go.onclick = () => {
    if (t) return stop();
    if (left <= 0) left = total;
    box.classList.remove("ring"); go.textContent = "⏸";
    t = setInterval(() => { left--; show(); if (left <= 0) { stop(); box.classList.add("ring"); } }, 1000);
  };
  $("#trs").onclick = () => { stop(); box.classList.remove("ring"); left = total; show(); };
  show();
})();
</script>
